# Despliegue continuo (decisiones 12.6, G1 y G2): cuando la CI de main termina bien, construye la imagen de la
# aplicacion para x86 y ARM, la publica en GitHub Container Registry y, si hay un servidor configurado, le
# ordena actualizar solo la aplicacion por SSH. El esquema de la base no se toca (se instala una vez con
# deploy/install-schema.sh).
#
# Secretos del repositorio (Settings > Secrets and variables > Actions); sin ellos el flujo solo publica la imagen:
#   DESPLIEGUE_HOST        nombre o IP de la maquina virtual
#   DESPLIEGUE_USUARIO     usuario SSH (por ejemplo ubuntu)
#   DESPLIEGUE_LLAVE_SSH   llave privada SSH completa (la publica va en ~/.ssh/authorized_keys del servidor)
#   DESPLIEGUE_HOST_KEY    linea de known_hosts del servidor (resultado de: ssh-keyscan -t ed25519 <host>)
#   DESPLIEGUE_RUTA        carpeta del repositorio en el servidor (por defecto ~/ImplementacionProyectoDB)
#   DESPLIEGUE_PUERTO      puerto SSH (por defecto 22)
# Ningun valor real va en este archivo.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  publicar-imagen:
    name: Construir y publicar la imagen (x86 y ARM)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # GHCR exige el nombre en minusculas
      - name: Nombre de la imagen
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/implementacionproyectodb" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:latest
            ${{ steps.nombre.outputs.imagen }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  actualizar-servidor:
    name: Actualizar la aplicacion en la maquina virtual
    needs: publicar-imagen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAY_SERVIDOR: ${{ secrets.DESPLIEGUE_HOST != '' && secrets.DESPLIEGUE_LLAVE_SSH != '' }}
    steps:
      - name: Sin servidor configurado
        if: env.HAY_SERVIDOR != 'true'
        run: |
          echo "No hay secretos DESPLIEGUE_*: la imagen quedo publicada y no se actualiza ningun servidor."

      - name: Actualizar solo la aplicacion por SSH
        if: env.HAY_SERVIDOR == 'true'
        env:
          HOST: ${{ secrets.DESPLIEGUE_HOST }}
          USUARIO: ${{ secrets.DESPLIEGUE_USUARIO }}
          LLAVE: ${{ secrets.DESPLIEGUE_LLAVE_SSH }}
          HOST_KEY: ${{ secrets.DESPLIEGUE_HOST_KEY }}
          RUTA: ${{ secrets.DESPLIEGUE_RUTA }}
          PUERTO: ${{ secrets.DESPLIEGUE_PUERTO }}
          IMAGEN: ${{ needs.publicar-imagen.outputs.imagen }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LLAVE" > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          # se verifica la identidad del servidor con la linea de known_hosts guardada como secreto
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_despliegue -p "${PUERTO:-22}" -o StrictHostKeyChecking=yes \
            "${USUARIO}@${HOST}" \
            "cd ${RUTA:-~/ImplementacionProyectoDB} && IMAGEN_APP=${IMAGEN}:latest docker compose --env-file .env -f deploy/docker-compose.yml pull app && IMAGEN_APP=${IMAGEN}:latest docker compose --env-file .env -f deploy/docker-compose.yml up -d app"
