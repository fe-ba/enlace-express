# Oracle Database 23c Free para el desarrollo de Enlace Express.
# Las contrasenas salen de .env (ver .env.example); nunca se escriben aqui.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: enlace-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?defina ORACLE_PASSWORD en .env}
      TZ: America/Bogota
    volumes:
      - enlace-oracle-datos:/opt/oracle/oradata
      # Scripts del proyecto, solo lectura, para ejecutarlos con el sqlplus del contenedor
      - ./database:/opt/enlace/database:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  enlace-oracle-datos:
    name: enlace-oracle-datos
